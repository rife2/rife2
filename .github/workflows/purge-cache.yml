name: purge-cache

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm purging all bld caches'
        required: true
        default: 'no'

jobs:
  clear-cache:
    if: ${{ inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Purge all bld caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -x
          for PREFIX in Linux-bld- Windows-bld- macOS-bld-; do
            echo "--- Purging $PREFIX ---"
            # list returns "id  key  size  created"
            gh cache list --key "$PREFIX" --limit 1000 | cut -f1 | while read -r id; do
              [ -z "$id" ] && continue
              echo "Deleting $id"
              gh cache delete "$id" || true
            done
          done
          echo "Done"
